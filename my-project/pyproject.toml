[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-project"
version = "1.0.0"
description = "Federated Learning with YOLOv5 using Flower"
license = "Apache-2.0"
dependencies = [
    # Flower upgraded 1.13.1 -> 1.31.0 (latest). The legacy ServerApp(server_fn=...)
    # + Strategy(configure_fit/aggregate_fit) API the project uses still imports and
    # constructs under 1.31 (verified). See docs/ENGINEERING_NOTES.md.
    # Floor raised 1.31.0 -> 1.33.0 (latest on PyPI, 2026-08-05). 1.33 is what the
    # GPU bring-up and the CI simulation-smoke job were verified against; it is also
    # the version whose runtime-env behaviour docs/GPU_TESTPLAN.md §6 documents.
    "flwr[simulation]>=1.33.0,<2.0.0",
    # flwr-datasets dropped: it was unused in source and pinned an old version that
    # blocked the flwr upgrade. The project partitions its own BDD100K batch shards.
    # Floor raised 8.0.0 -> 8.4.115 (latest on PyPI, 2026-08-05): 8.4 is where the
    # AMP check fetches yolo26n.pt and where the MLflow callback used by the
    # pipeline component lives.
    "ultralytics>=8.4.115",
    "numpy>=1.26.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.60.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flower"

[tool.flwr.app.components]
serverapp = "my_project.server_app:app"
clientapp = "my_project.client_app:app"

[tool.flwr.app.config]
num_server_rounds = 2
fraction_fit = 1.0
local_epochs = 1
# Must be <= num-supernodes below, otherwise FL never starts (waits forever for clients).
min_clients = 2
strategy = "fedavg"   # "fedavg" or "fedprox"
proximal_mu = 0.0     # FedProx proximal strength; >0 enables FedProx (default 0.1 if strategy=fedprox)
checkpoint_dir = "checkpoints"  # where the aggregated global model is saved
save_every = 1                  # save a global checkpoint every N rounds (always on final round)
# Ultralytics' dataset cache: "" (decode every epoch), "ram", or "disk". Empty is the
# default because RAM is the constraint: a shard held in RAM is roughly
# images x imgsz^2 x 3 bytes per *concurrent* client. The pipeline sets it per run.
cache = ""

# FedBN: every vehicle keeps its own BatchNorm layers and takes the rest of the
# network from the aggregate. Aimed at CONDITION partitioning, where the non-IID axis
# is feature shift and BN buffers are exactly what encodes it. On a random (IID) fleet
# expect little -- every client sees the same distribution, so there is no shift to
# keep local. In YOLOv8s-13 this is 285 of 355 state tensors (80.3 %) but only 0.36 %
# of the values.
#
# It leaves NO single global model: the checkpoint still carries the averaged
# BatchNorm, which is no vehicle's, so a holdout score on it measures a model that
# never existed. Compare per-vehicle, or re-estimate BN on the holdout, and say which.
local_bn = false

# Every key below is read by server_app but never sent by the pipeline. They are
# declared because flwr validates --run-config against this section and rejects the
# whole run for a key it has never heard of -- so an undeclared key is not a default,
# it is a crash at parse time for anyone who passes it by hand.
fraction_evaluate = 1.0   # <1.0 skips clients' self-evaluation: phase 0 measured 13.8 % of wall clock
plots_every_round = false # true restores drawing ultralytics' pictures every round (~1.19x slower)
# optimizer="auto" DISCARDS lr0 and substitutes 0.002*5/(4+nc). Set this to a real
# name ("AdamW", "SGD") or lr0 below is inert and the client will say so.
optimizer = "auto"
lr0 = 0.0                 # 0.0 = leave ultralytics alone
mosaic = -1.0             # negative = leave the default; 0.0 legitimately means "mosaic off"
# Freeze the first N layers on ROUND 1 ONLY, so the part-random head settles against
# features the backbone already had instead of pulling them apart. 10 is the YOLOv8s
# backbone; 0 = off. Measured motivation: the warm-started model scored 0.2582 on the
# holdout untrained and 0.2073 after two rounds. Prior art: arXiv:2306.03937 (probe then
# fine-tune), arXiv:2106.06042 (FedBABU), arXiv:2310.17097 (FedSTO, on BDD100K).
freeze_round1 = 0

# Server-side EMA of the aggregated model, across rounds. 0.0 = off. The federation ends
# every round on an essentially unsmoothed model while the centralised ceiling it is
# compared against does not: ultralytics rebuilds its own EMA per train() with updates=0,
# so 88 client steps reach decay 0.043 against the ceiling's 0.795. Averaging has to
# happen where the rounds are. Bias-corrected, so round 1 is exactly the aggregate.
# This changes what the clients continue from, so it is a different federation, not a
# reporting change. Prior art: arXiv:2507.20016 (FedSWA), arXiv:2505.00318 (FedEMA).
server_ema = 0.0

# FixBN (arXiv:2303.06530): from this round onward, every client normalises with the
# aggregate's BatchNorm statistics and stops updating them. 0 = off. The warm-up matters:
# the statistics have to be worth pinning before they are pinned, so 1 would pin COCO's
# initial ones. Unlike FedBN this leaves ONE global model, so the holdout keeps measuring
# the model that was actually trained.
fix_bn_from_round = 0

# Input resolution for training AND for the clients' own validation. BDD100K frames are
# 1280x720, so at 640 a traffic light is sub-20px. Published numbers on this dataset:
# 0.470 mAP50 for yolov8n at 640 against 0.625 for yolov8s at 1024. The pipeline scores
# the shared holdout and the centralised baseline at whatever this is set to, so raising
# it does not quietly become an unfair comparison. Costs activation memory as the square:
# the client scales its batch by (640/imgsz)^2.
imgsz = 640

# NOTE: `flwr run` rewrites this section in place on first use — it migrates the
# federations to ~/.flwr/config.toml and comments out everything below, leaving a
# "CONFIGURATION MIGRATION NOTICE" banner. That is a local artifact: do NOT commit
# the commented-out version, or a fresh clone has no federation to run at all.
# `git checkout -- pyproject.toml` after a run, and change live settings with
# `flwr run . --federation-config "..."` or in ~/.flwr/config.toml.


#######################################################################
# CONFIGURATION MIGRATION NOTICE:
#
# What was previously called "federation config" for SuperLink
# connections in pyproject.toml has been renamed and moved.
#
# These settings are now **SuperLink connection configuration**
# and are defined in the Flower configuration file.
#
# The entries below are commented out intentionally and are kept
# only as a migration reference.
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
#######################################################################

# [tool.flwr.federations]
# default = "local-simulation"

# [tool.flwr.federations.local-simulation]
# options.num-supernodes = 2
# options.backend.client-resources.num-cpus = 4
# # num-gpus = 1.0 on a single-card host makes Ray schedule clients ONE AT A TIME on
# # the GPU: slower, but no OOM. Drop to 0.5/0.33 only once you know one client's real
# # footprint. Set to 0 to fall back to CPU-only hosts.
# options.backend.client-resources.num-gpus = 1.0
# # flwr >= 1.31 reads `init-args` with dashes; the old `init_args.num_cpus` spelling
# # is parsed as an unknown key and silently ignored.
# options.backend.init-args.num-cpus = 8
# options.backend.init-args.num-gpus = 1

# # Real distributed deployment (Flower Deployment Engine): one SuperLink + N
# # SuperNodes over gRPC+TLS. Point `address` at the SuperLink Exec API (9093) and
# # `root-certificates` at the CA cert. Run with: flwr run . remote-deployment
# # Override the host with the FL_SUPERLINK_HOST env at launch time if templating.
# [tool.flwr.federations.remote-deployment]
# address = "127.0.0.1:9093"
# root-certificates = "certs/ca.crt"
